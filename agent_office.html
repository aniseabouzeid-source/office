<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Office</title>
<style>
  :root{
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-edge: #232a3a;
    --ink: #e7edf7;
    --muted: #7d8bab;
    --green: #6ee7a0;
    --amber: #ffc46b;
    --accent: #5fd8ff;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Segoe UI", Inter, system-ui, sans-serif; overflow:hidden; }
  #app{ display:flex; flex-direction:column; height:100vh; padding:14px; gap:10px; }

  #titlebar{ display:flex; align-items:center; gap:10px; padding:2px 4px; flex:none; }
  .tl-dot{ width:11px; height:11px; border-radius:50%; }
  #titlebar .name{ font-size:13px; color:var(--muted); margin-left:4px; }
  #titlebar .mode{ margin-left:auto; font-size:12px; color:var(--green); background:rgba(110,231,160,0.1);
    border:1px solid rgba(110,231,160,0.3); padding:3px 10px; border-radius:20px; }

  #main{ flex:1; display:flex; gap:10px; min-height:0; }

  #officeWrap{ flex:1.5; background:#000; border-radius:10px; overflow:hidden; border:1px solid var(--panel-edge);
    display:flex; align-items:center; justify-content:center; position:relative; min-width:0; }
  #officeCanvas{ width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  #officeLabel{ position:absolute; top:8px; left:10px; font-size:11px; color:rgba(255,255,255,0.55); }

  #cc{ flex:1; background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    display:flex; flex-direction:column; min-width:280px; }
  #ccHeader{ padding:12px 14px 8px; border-bottom:1px solid var(--panel-edge); }
  #ccHeader .who{ font-size:11px; color:var(--muted); letter-spacing:0.03em; }
  #ccHeader h2{ margin:2px 0 6px; font-size:18px; }
  .statusPill{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600; }
  .pill-idle{ background:rgba(125,139,171,0.18); color:var(--muted); }
  .pill-working{ background:rgba(95,216,255,0.15); color:var(--accent); }

  #tabs{ display:flex; gap:2px; padding:8px 10px 0; }
  .tab{ background:none; border:none; color:var(--muted); font-size:12px; padding:7px 11px;
    border-radius:8px 8px 0 0; cursor:pointer; }
  .tab.active{ color:var(--ink); background:rgba(255,255,255,0.05); }

  #tabBody{ flex:1; min-height:0; display:flex; flex-direction:column; padding:10px 12px 12px; }
  #terminal{ flex:1; overflow-y:auto; background:#090b10; border-radius:8px; padding:10px 12px;
    font-family: "SF Mono", Consolas, monospace; font-size:12.2px; line-height:1.6; }
  .l-info{ color:#9fb0d0; }
  .l-task{ color:var(--green); }
  .l-warn{ color:var(--amber); }
  .l-user{ color:var(--accent); }
  .staticTab{ font-size:13px; color:#c4cee3; line-height:1.7; padding:4px 2px; }
  .staticTab li{ margin-bottom:6px; }

  #queue{ display:flex; gap:8px; margin-top:10px; flex:none; }
  #queue input{ flex:1; background:#090b10; border:1px solid var(--panel-edge); border-radius:8px;
    padding:9px 11px; color:var(--ink); font-size:13px; }
  #queue input:focus{ outline:1px solid var(--accent); }
  #queue button{ background:var(--amber); border:none; border-radius:8px; padding:0 16px; font-weight:700;
    color:#241b02; cursor:pointer; font-size:13px; }
  #queue button:active{ transform:translateY(1px); }

  #roster{ flex:none; display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; }
  .card{ flex:none; width:98px; background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:9px 8px; text-align:center; cursor:pointer; transition:border-color .15s ease; }
  .card:hover{ border-color:#3a465f; }
  .card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .avatar{ width:34px; height:34px; border-radius:8px; margin:0 auto 6px; display:flex; align-items:center;
    justify-content:center; font-weight:800; font-size:14px; color:#0b0e14; }
  .card .nm{ font-size:12px; font-weight:600; }
  .card .st{ font-size:10px; margin-top:3px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="tl-dot" style="background:#ff5f57"></div>
    <div class="tl-dot" style="background:#febc2e"></div>
    <div class="tl-dot" style="background:#28c840"></div>
    <span class="name">agent-office &mdash; v0.1</span>
    <span class="mode">auto mode on</span>
  </div>

  <div id="main">
    <div id="officeWrap">
      <div id="officeLabel">floor 1</div>
      <canvas id="officeCanvas" width="400" height="260"></canvas>
    </div>

    <div id="cc">
      <div id="ccHeader">
        <div class="who">COMMAND CENTER</div>
        <h2 id="ccName">Nova</h2>
        <span class="statusPill" id="ccStatus"></span>
      </div>
      <div id="tabs">
        <button class="tab active" data-tab="terminal">Terminal</button>
        <button class="tab" data-tab="tasks">Tasks</button>
        <button class="tab" data-tab="memory">Memory</button>
        <button class="tab" data-tab="activity">Activity</button>
      </div>
      <div id="tabBody">
        <div id="terminal"></div>
        <div id="queue">
          <input id="queueInput" placeholder="Message this agent...">
          <button id="queueSend">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="roster"></div>
</div>

<script>
// ---------------- agents ----------------
const AGENTS = [
  { id:'nova',  name:'Nova',  color:'#5fd8ff', role:'research',
    tasks:['Reading through recent papers','Summarizing market research','Fact-checking a draft report'] },
  { id:'ridge', name:'Ridge', color:'#5c8dff', role:'coding',
    tasks:['Refactoring the auth module','Writing unit tests','Reviewing a pull request'] },
  { id:'sage',  name:'Sage',  color:'#b58bff', role:'writing',
    tasks:['Drafting the quarterly newsletter','Editing a blog post for tone','Writing release notes'] },
  { id:'juno',  name:'Juno',  color:'#ff7fb0', role:'design',
    tasks:['Sketching a dashboard layout','Building a component library','Prototyping a mobile flow'] },
  { id:'wren',  name:'Wren',  color:'#ffc46b', role:'support',
    tasks:['Answering a customer question','Updating the help center','Triaging a bug report'] },
  { id:'ember', name:'Ember', color:'#8bffb0', role:'ops',
    tasks:['Checking the deploy pipeline','Rotating API keys','Watching the error dashboard'] },
];
AGENTS.forEach((a,i)=>{
  a.status = Math.random()<0.6 ? 'working' : 'idle';
  a.deskIndex = i;
  a.log = [
    {t:'info', m:`$ agent boot sequence...`},
    {t:'info', m:`> loaded profile: ${a.name}`},
    {t:'task', m:`> current task: ${a.tasks[0]}`},
    {t:'info', m:`> status: ${a.status}`},
  ];
});
let selected = AGENTS[0];

// ---------------- office canvas (pixel art) ----------------
const cvs = document.getElementById('officeCanvas');
const gtx = cvs.getContext('2d');
gtx.imageSmoothingEnabled = false;

// two neat rows of cubicles, facing each other, plus a lounge nook
const DESK_POS = [
  {x:64,  y:70}, {x:132, y:70}, {x:200, y:70},
  {x:64,  y:150},{x:132, y:150},{x:200, y:150},
];

function px(x,y,w,h,color){ gtx.fillStyle=color; gtx.fillRect(x,y,w,h); }

function drawFloor(){
  // base carpet
  px(0,0,400,260,'#3c584f');
  for(let x=0;x<400;x+=16) for(let y=0;y<260;y+=16){
    px(x,y,16,16, ((x/16+y/16)%2===0) ? '#3e5b52' : '#385449');
  }
  // outer walls
  gtx.strokeStyle = '#1c2e2a'; gtx.lineWidth = 10;
  gtx.strokeRect(5,5,390,250);
  // windows along top wall
  for(let i=0;i<4;i++){ px(36+i*84, 4, 50, 9, '#9fd8ff'); px(36+i*84, 4, 50, 2, '#e6f6ff'); }

  // work-floor rug
  px(40, 44, 210, 172, '#2f4a43');

  // partition walls between the two desk rows and columns (cubicle feel)
  px(40, 118, 210, 6, '#25443d');
  for(let i=0;i<3;i++) px(104+i*68, 44, 5, 172, '#25443d');

  // divider wall to the lounge / side room
  px(266, 5, 8, 250, '#1c2e2a');
  px(266, 90, 8, 40, '#3c584f'); // doorway gap

  // ---- lounge area (right nook) ----
  px(280, 20, 108, 100, '#33463f');
  px(296, 32, 40, 22, '#c9556b');           // couch
  px(296, 30, 40, 5, '#e07a8e');
  px(346, 34, 20, 16, '#5a3d26');           // side table
  px(320, 70, 30, 18, '#6b4a2f');           // coffee table
  px(360, 96, 14, 20, '#6b4a2f');           // plant pot
  px(356, 76, 22, 22, '#2f8f52');
  px(360, 70, 14, 14, '#3aa862');

  // ---- reception / entrance (bottom) ----
  px(280, 150, 108, 90, '#33463f');
  px(320, 226, 28, 8, '#caa25a'); // door mat
  px(305, 168, 60, 26, '#8a5a34'); // reception desk
  px(310, 160, 50, 10, '#a06a3d');
}

function drawPerson(cx, cy, color, bob){
  const y = cy + bob;
  px(cx-6, y+6, 5, 7, '#22242f');           // legs
  px(cx+1, y+6, 5, 7, '#22242f');
  px(cx-7, y-6, 14, 12, color);             // body/shirt
  px(cx-7, y-1, 14, 3, shadeHex(color,-30));// shirt shading
  px(cx-4, y-8, 3, 4, '#f2c299');           // left arm
  px(cx+1, y-8, 3, 4, '#f2c299');           // right arm
  px(cx-5, y-17, 10, 10, '#f2c299');        // head
  px(cx-5, y-19, 10, 5, '#3a2a20');         // hair
  px(cx-3, y-14, 2, 2, '#2a2a2a');          // eyes
  px(cx+1, y-14, 2, 2, '#2a2a2a');
}

function shadeHex(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
  return `rgb(${r},${g},${b})`;
}

function drawDesk(dx,dy,agent,time){
  // desk surface
  px(dx-20, dy+2, 50, 22, '#8a5a34');
  px(dx-20, dy, 50, 4, '#a06a3d');
  px(dx-20, dy+2, 50, 3, 'rgba(0,0,0,0.15)');
  // monitor
  px(dx-7, dy-16, 24, 17, '#161a24');
  px(dx-4, dy-13, 18, 10, agent.status==='working' ? '#5fd8ff' : '#33445c');
  px(dx-2, dy+1, 4, 4, '#0e1118'); // stand
  // keyboard + mouse
  px(dx-15, dy+7, 20, 5, '#0e1118');
  px(dx+8, dy+8, 4, 4, '#0e1118');

  const bob = Math.sin(time*2 + dx) * 1.1;
  drawPerson(dx, dy+22, agent.color, bob);

  if(agent===selected){
    gtx.strokeStyle = '#ffd977';
    gtx.lineWidth = 2;
    gtx.strokeRect(dx-24, dy-20, 58, 58);
    gtx.fillStyle = '#ffd977';
    gtx.font = '10px monospace';
    gtx.textAlign = 'center';
    gtx.fillText(agent.name, dx, dy-24);
  }
}

let t0 = performance.now();
function drawOffice(){
  const time = (performance.now()-t0)/1000;
  drawFloor();
  DESK_POS.forEach((p,i)=> drawDesk(p.x, p.y, AGENTS[i], time));
  requestAnimationFrame(drawOffice);
}
drawOffice();

// ---------------- command center panel ----------------
const ccName = document.getElementById('ccName');
const ccStatus = document.getElementById('ccStatus');
const terminal = document.getElementById('terminal');
const tabs = document.querySelectorAll('.tab');
const tabBody = document.getElementById('tabBody');
let activeTab = 'terminal';

function renderStatusPill(){
  ccStatus.textContent = selected.status;
  ccStatus.className = 'statusPill ' + (selected.status==='working' ? 'pill-working' : 'pill-idle');
}

function renderTerminal(){
  terminal.innerHTML = selected.log.map(l=>`<div class="l-${l.t}">${l.m}</div>`).join('');
  terminal.scrollTop = terminal.scrollHeight;
}

function renderTasks(){
  tabBody.querySelector('#terminal')?.remove();
  document.getElementById('queue').style.display = activeTab==='terminal' ? 'flex' : 'none';
}

function renderTabBody(){
  if(activeTab==='terminal'){
    tabBody.innerHTML = `<div id="terminal"></div>
      <div id="queue"><input id="queueInput" placeholder="Message this agent..."><button id="queueSend">Send</button></div>`;
    bindQueue();
    renderTerminal();
  } else if(activeTab==='tasks'){
    tabBody.innerHTML = `<ul class="staticTab">${selected.tasks.map(t=>`<li>&#9744; ${t}</li>`).join('')}</ul>`;
  } else if(activeTab==='memory'){
    tabBody.innerHTML = `<ul class="staticTab">
      <li>Prefers short status updates over long summaries</li>
      <li>Last handed off to ${AGENTS[(AGENTS.indexOf(selected)+1)%AGENTS.length].name} on the ${selected.role} queue</li>
      <li>Working directory: /agents/${selected.id}</li>
    </ul>`;
  } else if(activeTab==='activity'){
    tabBody.innerHTML = `<ul class="staticTab">
      <li>Switched to ${selected.status} 4m ago</li>
      <li>Picked up a new ${selected.role} task</li>
      <li>Checked in with the team channel</li>
    </ul>`;
  }
}

function bindQueue(){
  const input = document.getElementById('queueInput');
  const btn = document.getElementById('queueSend');
  const send = ()=>{
    const val = input.value.trim();
    if(!val) return;
    selected.log.push({t:'user', m:'you: '+val});
    renderTerminal();
    input.value='';
    setTimeout(()=>{
      const reply = Math.random()<0.5
        ? `> on it — ${selected.tasks[Math.floor(Math.random()*selected.tasks.length)].toLowerCase()}`
        : `> got it, adding that to the queue`;
      selected.log.push({t:'task', m:reply});
      selected.status = 'working';
      renderTerminal(); renderStatusPill(); renderRoster();
    }, 500);
  };
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

tabs.forEach(tb=> tb.addEventListener('click', ()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  tb.classList.add('active');
  activeTab = tb.dataset.tab;
  renderTabBody();
}));

function selectAgent(agent){
  selected = agent;
  ccName.textContent = agent.name;
  renderStatusPill();
  renderTabBody();
  renderRoster();
}

// ---------------- roster ----------------
const roster = document.getElementById('roster');
function renderRoster(){
  roster.innerHTML = AGENTS.map(a=>`
    <div class="card ${a===selected?'selected':''}" data-id="${a.id}">
      <div class="avatar" style="background:${a.color}">${a.name[0]}</div>
      <div class="nm">${a.name}</div>
      <div class="st" style="color:${a.status==='working' ? a.color : '#7d8bab'}">${a.status}</div>
    </div>
  `).join('');
  roster.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> selectAgent(AGENTS.find(a=>a.id===c.dataset.id)));
  });
}

// ---------------- background liveliness ----------------
setInterval(()=>{
  const a = AGENTS[Math.floor(Math.random()*AGENTS.length)];
  a.status = Math.random()<0.7 ? 'working' : 'idle';
  a.log.push({t: Math.random()<0.8?'task':'warn',
    m:'> ' + a.tasks[Math.floor(Math.random()*a.tasks.length)]});
  if(a===selected){ renderTerminal(); renderStatusPill(); }
  renderRoster();
}, 4500);

selectAgent(AGENTS[0]);
</script>
</body>
</html>
